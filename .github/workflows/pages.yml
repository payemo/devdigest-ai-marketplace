name: Deploy catalog site

on:
  push:
    branches: [main]
    paths:
      - "catalog-site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "catalog-site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit SHA to build and deploy (empty = the selected branch). Use an older commit to roll the site back."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalog-site
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: catalog-site/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: catalog-site/dist

  deploy:
    # Pull requests only verify that the site builds; only main publishes.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
